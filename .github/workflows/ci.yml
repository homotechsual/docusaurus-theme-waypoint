name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Remove built-in Yarn
        run: npm uninstall -g yarn

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'yarn'

      - run: yarn install --immutable
      - run: yarn typecheck
      - run: yarn build
      - run: yarn test:unit
      - run: yarn workspace waypoint-demo build

      - name: Install Microsoft Edge
        run: yarn playwright install msedge --with-deps

      - run: yarn test:e2e
