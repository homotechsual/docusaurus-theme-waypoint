name: Deploy Demo

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Remove built-in Yarn
        run: npm uninstall -g yarn

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'yarn'

      - run: yarn install --immutable
      - run: yarn build
      - run: yarn workspace waypoint-demo build

      - name: Publish to Cloudflare Pages
        id: cloudflare-pages-deploy
        uses: cloudflare/wrangler-action@v4
        with:
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: 'pages deploy demo/build --project-name=docusaurus-waypoint'
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve deployment URLs
        id: deployment-urls
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.cloudflare-pages-deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.cloudflare-pages-deploy.outputs.pages-deployment-alias-url }}
        run: |
          preview_url="$ALIAS_URL"
          if [ -z "$preview_url" ] || [ "$preview_url" = "undefined" ]; then
            preview_url="$DEPLOYMENT_URL"
          fi
          echo "deployment_url=$DEPLOYMENT_URL" >> "$GITHUB_OUTPUT"
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"

      - name: Write deployment summary
        env:
          DEPLOYMENT_URL: ${{ steps.deployment-urls.outputs.deployment_url }}
          PREVIEW_URL: ${{ steps.deployment-urls.outputs.preview_url }}
          ENVIRONMENT: ${{ steps.cloudflare-pages-deploy.outputs.pages-environment }}
        run: |
          {
            echo "## Cloudflare Pages deployment"
            echo
            echo "| Name | Result |"
            echo "| --- | --- |"
            echo "| Deployment URL | [$DEPLOYMENT_URL]($DEPLOYMENT_URL) |"
            echo "| Preview URL | [$PREVIEW_URL]($PREVIEW_URL) |"
            echo "| Environment | $ENVIRONMENT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: mshick/add-pr-comment@v2
        with:
          message: |
            ### Deployed to Cloudflare Pages

            Preview: ${{ steps.deployment-urls.outputs.preview_url }}
            Deployment: ${{ steps.deployment-urls.outputs.deployment_url }}
